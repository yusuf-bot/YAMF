name: Scheduled Cron Job

# Run every 5 minutes with 1-minute offset (at :01, :06, :11, :16, etc.)
on:
  schedule:
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 * * * *'
  
  # Allow manual triggering for testing
  workflow_dispatch:

jobs:
  cron-job:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Execute cron job
      run: |
        echo "Cron job executed at $(date)"
        # Replace this with your actual webhook call or script
        curl -X POST \
          -H "Content-Type: application/json" \
          -d '{"message": "Cron job executed", "timestamp": "'$(date -Iseconds)'"}' \
          "${{ secrets.WEBHOOK_URL }}"
